spring.application.name=hrms-backend
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=src/main/resources/uploads

# ---- JWT ----
app.jwt.secret=ViHaTechHRMSSuperSecretKeyChangeThisInProduction2026!!
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:8080
